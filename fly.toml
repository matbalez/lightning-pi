app = "lightning-pi-matbalez"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_ORIGIN = "https://lightning-pi-matbalez.fly.dev"
  PRICE_MSAT = "100000"
  MAX_DIGITS = "10000"
  REPLAY_DB = "/data/state/replay.sqlite"
  RUST_LOG = "lightning_pi=info"

[[mounts]]
  source = "replay_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
