[package]
name = "lightning-pi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
default-run = "lightning-pi"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bitcoin = "0.32"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
fs2 = "0.4"
lexe = { version = "=0.1.23", features = ["unstable"] }
lexe-api-core = "=0.1.23"
lightning-invoice = "=0.35.0-beta1"
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
